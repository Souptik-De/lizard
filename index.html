<body style="width:100vw;height:100vh;background-image:url(lizard.gif);
    background-size:clamp(8px,calc(var(--mouse-y)/1*1px),100vmin)auto;
    background-position:calc(var(--mouse-x)*1px) 50%;overflow:hidden;
">

    <script>
        
        
        const d = document.documentElement;
        d.addEventListener('pointermove', e => {
            d.style.setProperty('--mouse-x', e.clientX);
            d.style.setProperty('--mouse-y', e.clientY);

        }

        );

        const text = "Never Gonna Give You Up Never Gonna Let You Down Never Gonna Run Around and Desert You ";
        let i = 0;

        function animateTitle() {
            document.title = text.slice(i) + text.slice(0, i);
            i = (i + 1) % text.length;

            setTimeout(animateTitle, 200);
        }

        animateTitle();

    </script>
